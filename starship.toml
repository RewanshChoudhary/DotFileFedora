# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                        STARSHIP PROMPT CONFIG                              ║
# ║  Active palette: catppuccin_mocha                                          ║
# ║  To switch: change `palette = "..."` below and uncomment that palette      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

add_newline = true

# ── Active Palette ─────────────────────────────────────────────────────────────
# Swap this value to any palette name defined at the bottom of this file:
#   catppuccin_mocha | persona4_golden | persona5_royal | persona3_reload
#   gruvbox_dark | persona_green | persona_purple | persona_orange
palette = "persona_purple"

format = """
[╭─](overlay0)$username$directory$git_branch$git_status$fill$cmd_duration$time
[╰─](overlay0)$character"""

# ── Modules ────────────────────────────────────────────────────────────────────

[fill]
symbol = " "

[username]
show_always = true
format = "[  $user ]($style)"
style_user = "bg:surface0 fg:pink"
style_root = "bg:surface0 fg:red"

[directory]
format = "[  $path ]($style)"
style = "bg:surface1 fg:lavender"
truncation_length = 3
truncate_to_repo = true
read_only = " "

[git_branch]
symbol = " "
format = "[ $symbol$branch ]($style)"
style = "bg:surface0 fg:blue"

[git_status]
format = "[ $all_status$ahead_behind ]($style)"
style = "bg:surface0 fg:teal"

[cmd_duration]
min_time = 500
format = "[ $duration](fg:blue)"

[time]
disabled = false
time_format = "%H:%M"
format = " [ $time](fg:pink)"

[character]
success_symbol = "[❯](bold fg:mint)"
error_symbol = "[❯](bold fg:red)"
vicmd_symbol = "[❮](bold fg:teal)"


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                            PALETTES                                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── 1. Catppuccin Mocha (DEFAULT) ──────────────────────────────────────────────
# Soft dark theme with pastel accents. Cozy and easy on the eyes.
# [palettes.catppuccin_mocha]
# overlay0 = "#6C7086"
# surface0 = "#313244"
# surface1 = "#45475A"
# blue     = "#89B4FA"
# lavender = "#B4BEFE"
# mint     = "#A6E3A1"
# pink     = "#F6A0CA"
# red      = "#F38BA8"
# teal     = "#94E2D5"
#
# ── 2. Persona 4 Golden ────────────────────────────────────────────────────────
# Midnight blue-black base with blazing gold accents. Foggy Inaba nights.
# To use: set palette = "persona4_golden"
#
# [palettes.persona4_golden]
# overlay0 = "#4a4a6a"   # lifted fog gray         → bracket connectors
# surface0 = "#1a1a2e"   # deep Inaba midnight     → username / git bg
# surface1 = "#2a2a44"   # slightly lifted night   → directory bg
# blue     = "#3d6b9e"   # TV static blue          → git branch, duration
# lavender = "#8899cc"   # moonlit lavender        → directory path
# mint     = "#4caf50"   # countryside green       → success prompt char
# pink     = "#f5c800"   # iconic P4G gold ★       → username, time
# red      = "#c0392b"   # shadow/danger crimson   → root, error char
# teal     = "#00bcd4"   # clear Inaba sky         → git status

