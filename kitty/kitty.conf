# /* ----  https://github.com/JaKooLit  ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
# theme option (use one):
include ./current-theme.conf
# include ./current-theme-purple.conf
include ./kitty-themes/persona-purple.conf

font_family AnomalyMono Nerd Font
font_size 11.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.95
confirm_os_window_close 0

# Animated cursor
cursor_trail 3

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no
window_padding_width 0
