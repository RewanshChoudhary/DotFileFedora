# See https://wiki.hyprland.org/Configuring/Keywords/
#  &  https://wiki.hyprland.org/Configuring/Binds/

# Main modifier
$mainMod = Super # super / meta / windows key

# Assign apps
$term = kitty
$editor = code --ozone-platform-hint=wayland --disable-gpu
$file = thunar
$browser = firefox
$volCtl = $patchScrPath/volumecontrol.sh

# Window/Session actions
bind = $mainMod, Q, exec, $scrPath/dontkillsteam.sh # close focused window
bind = $mainMod+Shift, Q, exec, $patchScrPath/killactiveprocess.sh # terminate the active client process
bind = Alt, F4, exec, $scrPath/dontkillsteam.sh # close focused window
bind = $mainMod, Delete, exit, # kill hyprland session
bind = Ctrl+Alt, Delete, exit, # alternate exit binding
bind = $mainMod+Shift, Space, togglefloating, # toggle the window between focus and float
bind = $mainMod, G, togglegroup, # toggle the window between focus and group
bind = Alt, Return, fullscreen, # toggle the window between focus and fullscreen
bind = $mainMod, L, exec, swaylock # launch lock screen
bind = Ctrl+Alt, L, exec, swaylock # alternate lock binding
bind = $mainMod+Shift, F, exec, $scrPath/windowpin.sh # toggle pin on focused window
bind = $mainMod, Backspace, exec, $scrPath/logoutlaunch.sh # launch logout menu
bind = Ctrl+Alt, P, exec, $scrPath/logoutlaunch.sh # alternate logout binding
bind = Ctrl+Alt, W, exec, killall waybar || waybar # toggle waybar
bind = $mainMod+Shift, N, exec, dunstctl history-pop # show the latest notification from history

# Application shortcuts
bind = $mainMod, T, exec, $term # launch terminal emulator
bind = $mainMod, E, exec, $file # launch file manager
bind = $mainMod, C, exec, $editor # launch text editor
bind = $mainMod, F, exec, $browser # launch web browser
bind = Ctrl+Shift, Escape, exec, $scrPath/sysmonlaunch.sh # launch system monitor (htop/btop or fallback to top)

# Rofi menus
bind = $mainMod, A, exec, pkill -x rofi || $scrPath/rofilaunch.sh d # launch application launcher
bind = $mainMod, Tab, exec, pkill -x rofi || $scrPath/rofilaunch.sh w # launch window switcher
bind = $mainMod+Shift, E, exec, pkill -x rofi || $scrPath/rofilaunch.sh f # launch file explorer
bind = $mainMod+Ctrl, E, exec, $patchScrPath/quicksettings.sh # quick settings menu

# Audio control
bindl  = , F10, exec, $volCtl -o m # toggle audio mute
bindel = , F11, exec, $volCtl -o d # decrease volume
bindel = , F12, exec, $volCtl -o i # increase volume
bindl  = , XF86AudioMute, exec, $volCtl -o m # toggle audio mute
bindl  = , XF86AudioMicMute, exec, $volCtl -i m # toggle microphone mute
bindel = , XF86AudioLowerVolume, exec, $volCtl -o d # decrease volume
bindel = , XF86AudioRaiseVolume, exec, $volCtl -o i # increase volume

# Media control
bindl  = , XF86AudioPlay, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioPause, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioNext, exec, playerctl next # media next
bindl  = , XF86AudioPrev, exec, playerctl previous # media previous
bindl  = , XF86AudioStop, exec, playerctl stop # stop media playback

# Brightness control
bindel = , XF86MonBrightnessUp, exec, $scrPath/brightnesscontrol.sh i # increase brightness
bindel = , XF86MonBrightnessDown, exec, $scrPath/brightnesscontrol.sh d # decrease brightness
bindl  = , XF86Sleep, exec, systemctl suspend # suspend the system
bindl  = , XF86Rfkill, exec, $patchScrPath/airplanemode.sh # toggle airplane mode

# Screenshot/Screencapture
bind = $mainMod, P, exec, $scrPath/screenshot.sh s # partial screenshot capture
bind = $mainMod+Ctrl, P, exec, $scrPath/screenshot.sh sf # partial screenshot capture (frozen screen)
bind = $mainMod+Alt, P, exec, $scrPath/screenshot.sh m # monitor screenshot capture
bind = , Print, exec, $scrPath/screenshot.sh p # all monitors screenshot capture
bind = $mainMod, Print, exec, $patchScrPath/screenshot_compat.sh now # full screenshot
bind = $mainMod+Shift, Print, exec, $patchScrPath/screenshot_compat.sh area # area screenshot
bind = $mainMod+Ctrl, Print, exec, $patchScrPath/screenshot_compat.sh in5 # delayed full screenshot
bind = $mainMod+Ctrl+Shift, Print, exec, $patchScrPath/screenshot_compat.sh in10 # longer delayed full screenshot
bind = Alt, Print, exec, $patchScrPath/screenshot_compat.sh active # active window screenshot
bind = $mainMod+Shift, S, exec, $patchScrPath/screenshot_compat.sh swappy # area screenshot with swappy when available

# Custom scripts
bind = $mainMod+Alt, G, exec, $scrPath/gamemode.sh # disable hypr effects for gamemode
bind = $mainMod+Ctrl, W, exec, $patchScrPath/swwwallpaper.sh -n # next wallpaper
bind = $mainMod+Ctrl+Shift, W, exec, $patchScrPath/swwwallpaper.sh -p # previous wallpaper
bind = $mainMod+Ctrl+Alt, W, exec, $patchScrPath/swwwallpaper.sh -r # random wallpaper
bind = $mainMod+Alt, Right, exec, $patchScrPath/swwwallpaper.sh -n # next wallpaper
bind = $mainMod+Alt, Left, exec, $patchScrPath/swwwallpaper.sh -p # previous wallpaper
bind = $mainMod+Ctrl, B, exec, $patchScrPath/wbarconfgen.sh n # next waybar mode
bind = $mainMod+Ctrl+Shift, B, exec, $patchScrPath/wbarconfgen.sh p # previous waybar mode
bind = $mainMod+Shift, B, exec, pkill -x rofi || $patchScrPath/wbarconfgen.sh m # launch waybar mode select menu
bind = $mainMod+Alt, Up, exec, $patchScrPath/wbarconfgen.sh n # next waybar mode
bind = $mainMod+Alt, Down, exec, $patchScrPath/wbarconfgen.sh p # previous waybar mode
bind = $mainMod+Shift, K, exec, pkill -x rofi || $HOME/.config/rofi/scripts/kitty-starship-select.sh # launch kitty+starship theme selector
bind = $mainMod+Ctrl, R, exec, $patchScrPath/wallbashtoggle.sh -n # next wallbash mode
bind = $mainMod+Ctrl+Shift, R, exec, $patchScrPath/wallbashtoggle.sh -p # previous wallbash mode
bind = $mainMod+Shift, R, exec, pkill -x rofi || $patchScrPath/wallbashtoggle.sh -m # launch wallbash mode select menu
bind = $mainMod+Ctrl, T, exec, $patchScrPath/themeselect.sh -n # next theme
bind = $mainMod+Ctrl+Shift, T, exec, $patchScrPath/themeselect.sh -p # previous theme
bind = $mainMod+Ctrl+Alt, T, exec, $patchScrPath/themeselect.sh -r # random theme
bind = $mainMod+Shift, T, exec, pkill -x rofi || $patchScrPath/themeselect.sh # launch theme select menu
bind = $mainMod+Ctrl, A, exec, $patchScrPath/rofiselect.sh -n # next rofi style
bind = $mainMod+Ctrl+Shift, A, exec, $patchScrPath/rofiselect.sh -p # previous rofi style
bind = $mainMod+Ctrl+Alt, A, exec, $patchScrPath/rofiselect.sh -r # random rofi style
bind = $mainMod+Shift, A, exec, pkill -x rofi || $patchScrPath/rofiselect.sh # launch select menu
bind = $mainMod+Shift, W, exec, pkill -x rofi || $scrPath/swwwallselect.sh # launch wallpaper select menu
bind = $mainMod, W, exec, pkill -x rofi || $scrPath/wallpaperselect.sh # launch wallpaper selector (themes + local)
bind = $mainMod, V, exec, pkill -x rofi || $scrPath/cliphist.sh c # launch clipboard
bind = $mainMod, K, exec, $scrPath/keyboardswitch.sh # switch keyboard layout
bind = $mainMod+Ctrl, D, layoutmsg, removemaster # remove the master window
bind = $mainMod, I, layoutmsg, addmaster # add the focused window to master
bind = $mainMod+Ctrl, Return, layoutmsg, swapwithmaster # swap with master
bind = $mainMod, M, exec, hyprctl dispatch splitratio 0.3 # snap the split ratio to 30%
bind = $mainMod+Ctrl, Tab, changegroupactive, f # cycle forward inside a group

# Move/Change window focus
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = Alt, Tab, cyclenext
bind = Alt, Tab, bringactivetotop

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces to a relative workspace
bind = $mainMod+Ctrl, Right, workspace, r+1
bind = $mainMod+Ctrl, Left, workspace, r-1

# Move to the first empty workspace
bind = $mainMod+Ctrl, Down, workspace, empty 

# Resize windows
binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30

# Move focused window to a workspace
bind = $mainMod+Shift, 1, movetoworkspace, 1
bind = $mainMod+Shift, 2, movetoworkspace, 2
bind = $mainMod+Shift, 3, movetoworkspace, 3
bind = $mainMod+Shift, 4, movetoworkspace, 4
bind = $mainMod+Shift, 5, movetoworkspace, 5
bind = $mainMod+Shift, 6, movetoworkspace, 6
bind = $mainMod+Shift, 7, movetoworkspace, 7
bind = $mainMod+Shift, 8, movetoworkspace, 8
bind = $mainMod+Shift, 9, movetoworkspace, 9
bind = $mainMod+Shift, 0, movetoworkspace, 10

# Move focused window to a relative workspace
bind = $mainMod+Ctrl+Alt, Right, movetoworkspace, r+1
bind = $mainMod+Ctrl+Alt, Left, movetoworkspace, r-1

# Move focused window around the current workspace
bind = $mainMod+Shift+Ctrl, Left, movewindow, l
bind = $mainMod+Shift+Ctrl, Right, movewindow, r
bind = $mainMod+Shift+Ctrl, Up, movewindow, u
bind = $mainMod+Shift+Ctrl, Down, movewindow, d

# Scroll through existing workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, period, workspace, e+1
bind = $mainMod, comma, workspace, e-1

# Move/Resize focused window
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# Move/Switch to special workspace (scratchpad)
bind = $mainMod+Alt, S, movetoworkspacesilent, special
bind = $mainMod, S, togglespecialworkspace,
bind = $mainMod+Shift, U, movetoworkspacesilent, special
bind = $mainMod, U, togglespecialworkspace,

# Move focused window to a workspace silently
bind = $mainMod+Alt, 1, movetoworkspacesilent, 1
bind = $mainMod+Alt, 2, movetoworkspacesilent, 2
bind = $mainMod+Alt, 3, movetoworkspacesilent, 3
bind = $mainMod+Alt, 4, movetoworkspacesilent, 4
bind = $mainMod+Alt, 5, movetoworkspacesilent, 5
bind = $mainMod+Alt, 6, movetoworkspacesilent, 6
bind = $mainMod+Alt, 7, movetoworkspacesilent, 7
bind = $mainMod+Alt, 8, movetoworkspacesilent, 8
bind = $mainMod+Alt, 9, movetoworkspacesilent, 9
bind = $mainMod+Alt, 0, movetoworkspacesilent, 10

bind = $mainMod+Alt, O, exec, $patchScrPath/toggleblur.sh # toggle low/medium blur for all windows
bind = $mainMod+Ctrl, O, exec, $patchScrPath/toggleallopaque.sh # toggle full opacity for all windows
bind = $mainMod+Ctrl, code:10, movetoworkspacesilent, 1
bind = $mainMod+Ctrl, code:11, movetoworkspacesilent, 2
bind = $mainMod+Ctrl, code:12, movetoworkspacesilent, 3
bind = $mainMod+Ctrl, code:13, movetoworkspacesilent, 4
bind = $mainMod+Ctrl, code:14, movetoworkspacesilent, 5
bind = $mainMod+Ctrl, code:15, movetoworkspacesilent, 6
bind = $mainMod+Ctrl, code:16, movetoworkspacesilent, 7
bind = $mainMod+Ctrl, code:17, movetoworkspacesilent, 8
bind = $mainMod+Ctrl, code:18, movetoworkspacesilent, 9
bind = $mainMod+Ctrl, code:19, movetoworkspacesilent, 10
bind = $mainMod+Shift, bracketleft, movetoworkspace, r-1
bind = $mainMod+Shift, bracketright, movetoworkspace, r+1
bind = $mainMod+Ctrl, bracketleft, movetoworkspacesilent, r-1
bind = $mainMod+Ctrl, bracketright, movetoworkspacesilent, r+1
