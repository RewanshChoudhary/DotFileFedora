
# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# See https://wiki.hyprland.org/Configuring/Window-Rules/

# ── Opacity: Global Window Baseline ──
# Managed by toggleallopaque.sh via decoration:active_opacity / decoration:inactive_opacity

# ── Blur ──
# Blur is global under `decoration.blur`, so all translucent windows share the same blur level.

# ── Float: Dialogs & Specific Windows ──
windowrule = match:class ^(org.kde.dolphin)$, match:title ^(Progress Dialog — Dolphin)$, float on
windowrule = match:class ^(org.kde.dolphin)$, match:title ^(Copying — Dolphin)$, float on
windowrule = match:class ^(firefox)$, match:title ^(Picture-in-Picture)$, float on
windowrule = match:class ^(firefox)$, match:title ^(Library)$, float on
windowrule = match:class ^(kitty)$, match:title ^(top)$, float on
windowrule = match:class ^(kitty)$, match:title ^(btop)$, float on
windowrule = match:class ^(kitty)$, match:title ^(htop)$, float on

# ── Float: Media & Settings Apps ──
windowrule = match:class ^(vlc)$, float on
windowrule = match:class ^(kvantummanager)$, float on
windowrule = match:class ^(qt5ct)$, float on
windowrule = match:class ^(qt6ct)$, float on
windowrule = match:class ^(nwg-look)$, float on
windowrule = match:class ^(org.kde.ark)$, float on
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-applet)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on

# ── Float: Additional Apps ──
windowrule = match:class ^(Signal)$, float on # Signal-Gtk
windowrule = match:class ^(com.github.rafostar.Clapper)$, float on # Clapper-Gtk
windowrule = match:class ^(app.drey.Warp)$, float on # Warp-Gtk
windowrule = match:class ^(net.davidotek.pupgui2)$, float on # ProtonUp-Qt
windowrule = match:class ^(yad)$, float on # Protontricks-Gtk
windowrule = match:class ^(eog)$, float on # Imageviewer-Gtk
windowrule = match:class ^(io.github.alainm23.planify)$, float on # planify-Gtk
windowrule = match:class ^(io.gitlab.theevilskeleton.Upscaler)$, float on # Upscaler-Gtk
windowrule = match:class ^(com.github.unrud.VideoDownloader)$, float on # VideoDownloader-Gtk
windowrule = match:class ^(io.gitlab.adhami3310.Impression)$, float on # Impression-Gtk
windowrule = match:class ^(io.missioncenter.MissionCenter)$, float on # MissionCenter-Gtk


# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

layerrule = match:namespace ^(rofi)$, blur on
layerrule = match:namespace ^(rofi)$, ignore_alpha 0
layerrule = match:namespace ^(notifications)$, blur on
layerrule = match:namespace ^(notifications)$, ignore_alpha 0
layerrule = match:namespace ^(swaync-notification-window)$, blur on
layerrule = match:namespace ^(swaync-notification-window)$, ignore_alpha 0
layerrule = match:namespace ^(swaync-control-center)$, blur on
layerrule = match:namespace ^(swaync-control-center)$, ignore_alpha 0
layerrule = match:namespace ^(logout_dialog)$, blur on
